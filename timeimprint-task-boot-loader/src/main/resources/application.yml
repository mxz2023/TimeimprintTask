spring:
  application:
    name: time-imprint-task
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_SECONDS:40}s
  datasource:
    url: ${DB_JDBC_URL:jdbc:mysql://127.0.0.1:13306/timeimprint_task_local?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:tit}
    password: ${DB_PASSWORD:tit_local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/capability/notification
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  shutdown: graceful

timeimprint:
  local:
    tenant-id: ${LOCAL_TENANT_ID:local-tenant}
    actor-id: ${LOCAL_ACTOR_ID:local-actor}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

---
spring:
  config:
    activate:
      on-profile: local,test
server:
  address: 127.0.0.1
