spring:
  application:
    name: time-imprint-task
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE_SECONDS:40}s
  datasource:
    url: ${DB_JDBC_URL:jdbc:mysql://127.0.0.1:13306/timeimprint_task_local?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:tit}
    password: ${DB_PASSWORD:tit_local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/capability/notification
mybatis:
  mapper-locations: classpath*:mapper/*.xml,classpath*:cn/net/mxz/timeimprint/task/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 65536
    max-swallow-size: 65536

timeimprint:
  local:
    tenant-id: ${LOCAL_TENANT_ID:local-tenant}
    actor-id: ${LOCAL_ACTOR_ID:local-actor}
  test:
    tenant-id: ${TEST_TENANT_ID:test-tenant}
    actor-id: ${TEST_ACTOR_ID:test-actor}
  notification:
    # 合法值：[IN_APP] 或 [IN_APP, FEISHU]；必须含 IN_APP。默认仅站内信（与 P01—P04 一致）。
    delivery-channels:
      - IN_APP
    # 仅当 delivery-channels 加入 FEISHU 时才读取并校验；凭据只来自环境变量，禁止写入仓库。
    # 启用示例：TIMEIMPRINT_NOTIFICATION_DELIVERYCHANNELS_1=FEISHU，并按需配置
    # timeimprint.notification.feishu.recipient-map.<platformUserId>=<open_id>（缺映射时飞书 Action 为 PERMANENT_FAILURE）。
    feishu:
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      base-url: ${FEISHU_BASE_URL:https://open.feishu.cn}
      # 单次 HTTP 调用超时；一次出站含「取令牌 + 发消息」，须 ≤ 5 才能落入 Handler 10 秒预算。
      timeout-seconds: ${FEISHU_TIMEOUT_SECONDS:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,liveSchema

---
spring:
  config:
    activate:
      on-profile: local,test
server:
  address: 127.0.0.1
